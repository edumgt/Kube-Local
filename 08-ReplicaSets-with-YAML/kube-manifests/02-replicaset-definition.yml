apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myapp2-rs
spec:
  replicas: 2          # HPA가 관리하므로 초기값을 낮게 설정
  selector:
    matchLabels:
      app: myapp2
  template:
    metadata:
      name: myapp2-pod
      labels:
        app: myapp2
    spec:
      containers:
        - name: myapp2-container
          image: 192.168.253.148:5000/fastapi-health:1.0
          ports:
            - containerPort: 8080
          resources:         # HPA 동작에 필수 - CPU 사용률 계산 기준
            requests:
              cpu: "100m"    # 0.1 vCPU 요청
              memory: "64Mi"
            limits:
              cpu: "500m"    # 최대 0.5 vCPU
              memory: "128Mi"


    