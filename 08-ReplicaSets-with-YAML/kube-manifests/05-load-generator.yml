---
# 부하 생성기: 공격 시뮬레이션용
# replicas 조정으로 부하 강도 조절
# - 1개: 평상시 트래픽
# - 5개: 중간 부하
# - 10개: 웹 공격 시뮬레이션
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-gen
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[INFO] Load generator started. Target: replicaset-nodeport-service:8080"
              while true; do
                wget -q -O- http://replicaset-nodeport-service:8080/health 2>/dev/null
                wget -q -O- http://replicaset-nodeport-service:8080/ 2>/dev/null
              done
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
