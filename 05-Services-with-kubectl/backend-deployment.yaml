apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-backend-rest-app
  labels:
    app: my-backend-rest-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-backend-rest-app
  template:
    metadata:
      labels:
        app: my-backend-rest-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: w1
      containers:
      - name: kube-helloworld
        image: stacksimplify/kube-helloworld:1.0.0
        ports:
        - containerPort: 8080
          hostPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: my-backend-service
  labels:
    app: my-backend-rest-app
spec:
  type: ClusterIP
  selector:
    app: my-backend-rest-app
  ports:
  - port: 8080
    targetPort: 8080
