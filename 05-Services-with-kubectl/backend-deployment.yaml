apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-backend-rest-app
  labels:
    app: my-backend-rest-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: my-backend-rest-app
  template:
    metadata:
      labels:
        app: my-backend-rest-app
    spec:
      containers:
      - name: kube-helloworld
        image: 172.29.41.131:5000/kube-helloworld:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: my-backend-service
  labels:
    app: my-backend-rest-app
spec:
  type: ClusterIP
  selector:
    app: my-backend-rest-app
  ports:
  - port: 8080
    targetPort: 8080
