apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-frontend-nginx-app
  labels:
    app: my-frontend-nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-frontend-nginx-app
  template:
    metadata:
      labels:
        app: my-frontend-nginx-app
    spec:
      containers:
      - name: kube-frontend-nginx
        image: stacksimplify/kube-frontend-nginx:1.0.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-frontend-service
  labels:
    app: my-frontend-nginx-app
spec:
  type: ClusterIP
  selector:
    app: my-frontend-nginx-app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-frontend-ingress
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-frontend-service
            port:
              number: 80
